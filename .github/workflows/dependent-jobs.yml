## YAML Template.

name: Dependent Jobs Workflow

on:
  push:
    branches:
      - master  # updated from main

jobs:
  build:
    name: Build Job
    runs-on: ubuntu-latest

    steps:
      - name: Starting Build
        run: echo "Building application..."

      - name: Simulate Build Process
        run: |
          sleep 5
          echo "Build completed successfully!"

  test:
    name: Test Job
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Starting Tests
        run: echo "Running tests..."

      - name: Simulate Testing
        run: |
          sleep 5
          echo "All tests passed!"

  deploy:
    name: Deploy Job
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Starting Deployment
        run: echo "Deploying application..."

      - name: Simulate Deployment
        run: |
          sleep 5
          echo "Deployment successful!"
